name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily rebuild so the GitHub snapshot (contribution graph fallback, star
  # counts - scripts/snapshot-github.mjs) never drifts far behind.
  schedule:
    - cron: '30 2 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      # No secrets needed: the TypeSafe ranking and the preview screenshots are
      # generated locally and committed, so CI only ever builds static output.
      # The Umami vars are public analytics IDs, not secrets - set as repo
      # variables (Settings > Secrets and variables > Actions > Variables).
      - name: Build
        run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_UMAMI_SRC: ${{ vars.NEXT_PUBLIC_UMAMI_SRC }}
          NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
          NEXT_PUBLIC_UMAMI_SHARE_URL: ${{ vars.NEXT_PUBLIC_UMAMI_SHARE_URL }}
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}

      # Loads the built site in Chrome (preinstalled on the runner): every
      # page, scroll-to-top, search, stack logos, the footer fight. A failure
      # here stops the deploy, so the live site keeps its last good build.
      - name: Browser tests
        run: npm run test:e2e

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
